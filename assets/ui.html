<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arya Terminal Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236ea8fe'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='15' fill='url(%23g)'/%3E%3Cpath d='M19 23l9 9-9 9' stroke='%230b0d12' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M33 43h12' stroke='%230b0d12' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d12;--bg2:#0f1218;--panel:#12151c;--panel2:#151922;--raise:#1b202b;
  --line:#222835;--line2:#2c3343;--text:#e6e9f0;--muted:#97a0b3;--dim:#666e82;
  --accent:#6ea8fe;--violet:#a78bfa;--ok:#3ecf8e;--bad:#f2676b;--warn:#f5b84c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,pre{font-family:var(--mono)}
[hidden]{display:none!important}
::selection{background:rgba(110,168,254,.35)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#262c3a;border-radius:10px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background-color:#353d50}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
svg{width:16px;height:16px;flex:none}

.top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .logo{width:28px;height:28px}
.brand .logo svg{width:28px;height:28px}
.brand b{font-size:14px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:12.5px}
.pill{font-size:11px;color:var(--muted);background:var(--raise);border:1px solid var(--line2);padding:2px 9px;border-radius:99px;white-space:nowrap}
.crumbs{flex:1;min-width:0;height:32px;display:flex;align-items:center;gap:1px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font:12px var(--mono);color:var(--muted);padding:0 6px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{background:none;border:0;padding:2px 6px;border-radius:5px;color:var(--muted);font:inherit}
.crumbs button:hover{background:var(--raise);color:var(--text)}
.crumbs button:last-child{color:var(--text)}
.crumbs .sep{color:var(--dim);padding:0 1px}
.tools{display:flex;align-items:center;gap:4px}
.ib{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--muted);padding:0}
.ib:hover{background:var(--raise);border-color:var(--line2);color:var(--text)}
.ib svg{width:17px;height:17px}
.switch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;padding:0 8px 0 4px;white-space:nowrap}
.switch input{display:none}
.switch i{width:30px;height:17px;border-radius:99px;background:#2a3040;position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#9aa3b5;transition:.2s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{left:15px;background:#fff}

main{flex:1;min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr)}
.side{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}

.search{position:relative;padding:12px 12px 8px}
.search svg{position:absolute;left:23px;top:22px;color:var(--dim)}
.search input{width:100%;height:36px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:0 52px 0 34px;font:inherit;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.14)}
.search kbd{position:absolute;right:21px;top:20px;font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:var(--panel)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.cat{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.cat:hover{color:var(--text);border-color:var(--line2)}
.cat.on{background:rgba(110,168,254,.14);border-color:rgba(110,168,254,.5);color:#dbe7ff}
.cat .n{font-size:10.5px;color:var(--dim);margin-left:3px}
.cat.on .n{color:#9fbef0}

.keys{flex:1;min-height:0;overflow:auto;padding:2px 12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.key{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:58px;padding:8px 11px;text-align:left;
  background:linear-gradient(180deg,#1f2431 0%,#181c26 100%);border:1px solid #2b3243;border-bottom:3px solid #090b10;border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);transition:border-color .15s,box-shadow .15s,transform .05s}
.key:hover{border-color:#3d4964;border-bottom-color:#090b10;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 22px -12px rgba(110,168,254,.6)}
.key:active,.key.press{transform:translateY(2px);border-bottom-width:1px;padding-bottom:10px}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.key .r{display:flex;align-items:center;gap:6px;min-width:0}
.key .t{min-width:0;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key code{flex:1;min-width:0;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .bd{display:flex;gap:3px;flex:none}
.key .bd svg{width:12px;height:12px}
.key.danger{border-color:#4d2c34;background:linear-gradient(180deg,#251d25,#1c171e)}
.key.danger:hover{border-color:#6e3a44;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 22px -12px rgba(242,103,107,.55)}
.key.danger .t{color:#ffcdd0}
.key.add{border-style:dashed;border-bottom-width:1px;background:transparent;color:var(--muted);flex-direction:row;align-items:center;justify-content:center;gap:7px}
.key.add:hover{color:var(--text)}
.i-warn{color:var(--bad)}.i-shield{color:var(--warn)}.i-ext{color:var(--accent)}.i-edit{color:var(--violet)}
.empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:30px 10px;font-size:12.5px}

.info{flex:0 0 41%;min-height:150px;overflow:auto;border-top:1px solid var(--line);background:var(--panel2);padding:13px 14px 16px}
.info .blank{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim);text-align:center;font-size:12.5px;padding:10px}
.info .blank svg{width:22px;height:22px}
.info h3{margin:0 0 9px;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;padding:1px 8px 1px 6px;border-radius:99px;border:1px solid}
.tag svg{width:11px;height:11px}
.tag.warn{color:#ffb7b9;border-color:#5a2b31;background:#2a171b}
.tag.shield{color:#ffd796;border-color:#5a4524;background:#2a2214}
.tag.ext{color:#b9d4ff;border-color:#2d4266;background:#16213a}
.tag.edit{color:#d8ccff;border-color:#43386a;background:#1f1a33}
.cmdline{display:flex;align-items:flex-start;gap:4px;background:#0a0c10;border:1px solid var(--line2);border-radius:8px;padding:5px 5px 5px 10px;margin-bottom:11px}
.cmdline code{flex:1;min-width:0;font-size:12px;line-height:1.55;padding-top:3px;color:#d7e6ff;white-space:pre-wrap;overflow-wrap:anywhere}
.cmdline .ib{width:27px;height:27px}
.cmdline .ib svg{width:14px;height:14px}
.ph{color:#cbbcff;background:rgba(167,139,250,.14);border-radius:4px;padding:0 3px;white-space:nowrap}
.info p{margin:0 0 12px;color:#c9cfdb}
.md code{font-size:11.5px;background:#0a0c10;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#b9d4ff}
.parts{margin:0 0 12px}
.parts .pt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.parts .p{display:grid;grid-template-columns:minmax(0,max-content) 1fr;gap:9px;align-items:baseline;padding:3px 0}
.parts .p>code{font-size:11px;background:#0a0c10;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#9ec5ff;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.parts .p>span{color:#b9c0cd;font-size:12px}
.other{font-size:11.5px;color:var(--dim);border-top:1px dashed var(--line);padding-top:9px}
.other code{color:var(--muted);word-break:break-all}

.term{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.out{flex:1;min-height:0;overflow:auto;padding:16px 18px 8px;font:12.5px/1.6 var(--mono)}
.blk{margin:0 0 12px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;overflow:hidden;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.blk.ok{border-left-color:var(--ok)}.blk.err{border-left-color:var(--bad)}.blk.stop{border-left-color:var(--warn)}.blk.ext{border-left-color:var(--violet)}
.bh{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;background:#121621;border-bottom:1px solid var(--line);min-height:34px}
.bh .cwd{color:var(--dim);font-size:11px;white-space:nowrap;max-width:28%;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.bh .cwd bdi{direction:ltr;unicode-bidi:isolate}
.bh .c{flex:1;min-width:0;color:#d6e4ff;white-space:pre-wrap;word-break:break-all}
.bh .c::before{content:"❯ ";color:var(--accent)}
.bh .st{font:11.5px var(--sans);color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:5px}
.bh .st svg{width:13px;height:13px}
.blk.ok .st{color:var(--ok)}.blk.err .st{color:var(--bad)}.blk.stop .st{color:var(--warn)}.blk.ext .st{color:#c4b5fd}
.bh .ba{display:flex;gap:1px;opacity:0;transition:opacity .15s}
.blk:hover .ba,.blk:focus-within .ba{opacity:1}
.bh .ba button{width:26px;height:24px;border:0;background:none;color:var(--muted);border-radius:6px;display:grid;place-items:center;padding:0}
.bh .ba button:hover{background:var(--raise);color:var(--text)}
.bh .ba svg{width:14px;height:14px}
.blk pre{margin:0;padding:9px 12px 11px;white-space:pre-wrap;word-break:break-word;color:#d3d8e2;font:inherit;tab-size:8}
.blk pre:empty{display:none}
.echo{color:#9fb3d1;font-style:italic}
.cut{font:11.5px var(--sans);color:var(--dim);padding:6px 12px 0}
.note{display:flex;align-items:flex-start;gap:7px;font:12px/1.5 var(--sans);padding:7px 12px;color:var(--muted);border-top:1px dashed var(--line)}
.note svg{width:14px;height:14px;margin-top:1px}
.note code{font-size:11.5px;color:#b9d4ff;word-break:break-all}
.note.hint{color:#ffd796;background:rgba(245,184,76,.05)}
.note.hint code{color:#ffe2a8}
.spin{width:11px;height:11px;border:2px solid rgba(110,168,254,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sys{font-size:11.5px;color:var(--dim);margin:0 0 10px 2px}
.welcome{font:13px/1.65 var(--sans);background:linear-gradient(135deg,rgba(110,168,254,.08),rgba(167,139,250,.06));border:1px solid var(--line2);border-radius:12px;padding:16px 18px;margin-bottom:14px;color:#cdd3df}
.welcome h2{margin:0 0 6px;font-size:16px;color:var(--text)}
.welcome p{margin:0 0 10px}
.welcome .tips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--muted);font-size:12px}
.welcome .meta{color:var(--dim);font-size:11.5px;margin:0}
.welcome .meta code{color:var(--muted)}
kbd{font-size:10.5px;background:var(--raise);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text)}

.bar{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;background:var(--panel);border-top:1px solid var(--line)}
.prompt{flex:none;max-width:32%;height:38px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.prompt .pp{overflow:hidden;text-overflow:ellipsis}
.prompt b{color:var(--accent)}
.prompt .venv{color:var(--ok)}
#cmd{flex:1;min-width:0;height:38px;max-height:160px;resize:none;overflow-y:auto;background:#0a0c10;border:1px solid var(--line2);border-radius:8px;color:var(--text);font:13px/1.5 var(--mono);padding:8px 11px;outline:none}
#cmd:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.14)}
#cmd.running{border-color:rgba(245,184,76,.55)}
#cmd.running:focus{box-shadow:0 0 0 3px rgba(245,184,76,.13)}
#cmd.typing{border-color:var(--violet)}
.btn{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:var(--text);font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#3e4862}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(180deg,#78aefe,#5b8ff0);border-color:#5b8ff0;color:#0a1022;font-weight:600}
.btn.red{background:linear-gradient(180deg,#f47a7e,#df5559);border-color:#df5559;color:#1f0a0b;font-weight:600}
.btn.primary:hover,.btn.red:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--line2)}
.bar .ib{width:38px;height:38px;border-color:var(--line)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(4,6,10,.62);backdrop-filter:blur(4px)}
.dlg{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:18px 18px 16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.75);animation:rise .16s ease-out}
.dlg h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.dlg h3 svg{width:18px;height:18px}
.dlg h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.dlg ul{margin:0;padding-left:18px;color:#c9cfdb}
.dlg li{margin:3px 0}
.dlg .grid{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;color:#c9cfdb}
.pv{background:#0a0c10;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font:12.5px/1.55 var(--mono);color:#d7e6ff;word-break:break-all;white-space:pre-wrap;margin-bottom:14px}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld>span{font-size:12px;color:var(--muted)}
.fld>span>code{color:#cbbcff}
.fld input,.fld textarea{width:100%;background:#0a0c10;border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:8px 10px;font:13px var(--mono);outline:none;resize:vertical}
.fld input.prose,.fld textarea.prose{font-family:var(--sans)}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.14)}
.fld input.bad{border-color:var(--bad)}
.fld small{color:var(--dim);font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.warnbox,.msg{display:flex;gap:9px;align-items:flex-start;border-radius:9px;padding:9px 11px;margin-bottom:12px;font-size:12.5px}
.warnbox{background:#2a171b;border:1px solid #5a2b31;color:#ffc6c8}
.warnbox svg{color:var(--bad);margin-top:1px}
.msg{background:var(--bg2);border:1px solid var(--line2);color:#c9cfdb}
.btns{display:flex;gap:8px;margin-top:4px}
.pop{position:fixed;z-index:30;max-height:240px;min-width:240px;max-width:60vw;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:4px;font:12px var(--mono);box-shadow:0 16px 40px -12px rgba(0,0,0,.75)}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 9px;border-radius:6px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop button.on,.pop button:hover{background:rgba(110,168,254,.16)}
.pop .d{color:#9ec5ff}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:60;background:#1f2533;border:1px solid var(--line2);color:var(--text);padding:8px 14px;border-radius:9px;font-size:12.5px;max-width:80vw;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.about{text-align:center}
.about h3{justify-content:center;margin-bottom:2px}
.about-logo svg{width:58px;height:58px;margin:2px auto 8px;display:block}
.about-ver{color:var(--dim);font-size:12px;margin:0 0 12px}
.about>p{color:#c9cfdb;margin:0 auto;max-width:400px}
.about-by{display:grid;gap:3px;max-width:320px;margin:16px auto;padding:13px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--bg2);color:var(--muted);font-size:12px}
.about-by b{color:var(--text);font-size:14.5px;margin-top:2px}
.about-by a{color:var(--accent);text-decoration:none;font-weight:600;margin-top:5px}
.about-by a:hover{text-decoration:underline}
.about .btns{justify-content:center}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,48%) minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .info,.pill,.brand span,.switch span,.prompt{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" id="logo"></span><b>Arya</b><span>Terminal Assistant</span></div>
  <span class="pill" id="osPill">…</span>
  <nav class="crumbs" id="crumbs" aria-label="Current folder"></nav>
  <div class="tools">
    <label class="switch" title="On: clicking a key runs it right away. Off: the key only types the command so you can edit it first."><input type="checkbox" id="autoRun" checked><i></i><span>Run on click</span></label>
    <button class="ib" id="btnFinder"></button>
    <button class="ib" id="btnTerm" title="Open the system terminal in this folder"></button>
    <button class="ib" id="btnReset" title="Fresh session: back to the home folder and the original environment"></button>
    <button class="ib" id="btnClear" title="Clear output (Ctrl+L)"></button>
    <button class="ib" id="btnHelp" title="Help &amp; shortcuts"></button>
    <button class="ib" id="btnAbout" title="About Arya Terminal Assistant"></button>
  </div>
</header>
<main>
  <aside class="side">
    <div class="search"><span id="searchIco"></span><input id="q" type="search" placeholder="Search commands…" autocomplete="off" spellcheck="false"><kbd id="searchKbd">Ctrl K</kbd></div>
    <div class="cats" id="cats"></div>
    <div class="keys" id="keys"></div>
    <section class="info" id="info"></section>
  </aside>
  <section class="term">
    <div class="out" id="out"></div>
    <div class="bar">
      <div class="prompt" id="prompt"></div>
      <textarea id="cmd" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Type a command, or click a key…"></textarea>
      <button class="btn primary" id="btnRun" title="Run (Enter)"></button>
      <button class="btn red" id="btnStop" title="Stop (Ctrl+C)" hidden></button>
      <button class="ib" id="btnExt" title="Run in a separate terminal window (for interactive programs)"></button>
      <button class="ib" id="btnAdmin" title="Run as Administrator (opens a separate window)" hidden></button>
      <button class="ib" id="btnSave" title="Save this command as a key in “My Commands”"></button>
    </div>
  </section>
</main>
<div class="modal" id="modal" hidden></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TOKEN = decodeURIComponent(location.hash.slice(1));
const CID = Math.random().toString(36).slice(2, 10);
const OUT = $('#out'), CMD = $('#cmd');

const ICONS = {
  logo: '<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect x="1" y="1" width="22" height="22" rx="6" fill="url(#lg)" stroke="none"/><path d="m7 8.5 3.5 3.5L7 15.5M12.5 16h4.5" stroke="#0b0d12" stroke-width="2.2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  ext: '<path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
  term: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7.5 10 3 2.5-3 2.5M12.5 15.5h4"/>',
  clear: '<path d="M21 5.5H9.2a1 1 0 0 0-.76.35L3.6 11.4a1 1 0 0 0 0 1.2l4.84 5.55a1 1 0 0 0 .76.35H21a1 1 0 0 0 1-1v-11a1 1 0 0 0-1-1zM12.5 9.5l5 5M17.5 9.5l-5 5"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.2.9-1.2 1.7v.4M12 17h.01"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/>',
  shield: '<path d="M12 3.5 19 6v5.5c0 4.3-3 7.7-7 9-4-1.3-7-4.7-7-9V6z"/>',
  star: '<path d="m12 4 2.5 5.1 5.6.8-4 4 1 5.6L12 16.8l-5.1 2.7 1-5.6-4-4 5.6-.8z"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5.5 15H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v.5"/>',
  edit: '<path d="M4 20h4.2L19.5 8.7a2 2 0 0 0 0-2.8l-1.4-1.4a2 2 0 0 0-2.8 0L4 15.8z"/>',
  redo: '<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4.5V10h-5.5"/>',
  reset: '<path d="M4 12a8 8 0 1 0 2.6-5.9M4 4.5V10h5.5"/>',
  warn: '<path d="M10.3 4.2 2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0zM12 9.5v4.5M12 17.2h.01"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x: '<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
  trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.9 11.1A2 2 0 0 0 9.4 20h5.2a2 2 0 0 0 2-1.9L17.5 7M9.5 7V4.5h5V7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.2M12 7.7h.01"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/>',
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const S = {
  os: 'mac', sep: '/', home: '', cwd: '', admin: false, shell: '', osName: '', dataDir: '',
  cats: [], lib: [], mine: [], cat: 'nav', q: '',
  job: null, history: [], hi: 0, draft: '', inserted: null, venv: '', busy: false,
  settings: {autoRun: true}, params: {}, hov: 0, pop: null, offline: false,
};
const MY_CAT = {id: 'my', icon: '⭐', name: 'My Commands'};

async function api(path, body) {
  const opt = {headers: {'X-Arya-Token': TOKEN, 'X-Arya-Client': CID}};
  if (body !== undefined) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); } catch (e) { offline(); throw new Error('Lost connection to Arya. Start the app again.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
  return data;
}

const cmdOf = c => (c && (c[S.os] || c.all)) || '';
const otherOf = c => (c.all ? '' : c[S.os === 'mac' ? 'win' : 'mac'] || '');
const on = v => v === true || v === S.os;
const PH = /<([A-Za-z][\w-]*)(?:=([^<>]*))?>/g;
const paramsOf = t => { const m = new Map(); for (const x of t.matchAll(PH)) if (!m.has(x[1])) m.set(x[1], x[2] ?? ''); return [...m].map(([name, def]) => ({name, def})); };
const plain = t => t.replace(PH, '<$1>');
const shown = t => t.replace(PH, (_, n, d) => (d ? d : `<${n}>`));
const fillIn = (t, v) => t.replace(PH, (_, n) => v[n] ?? '');
const keyOf = c => c.id || `${c.cat}:${c.title}`;
const needsAdmin = c => on(c.admin) || (S.os === 'mac' && /(^|[;&|(]\s*)sudo\s/.test(cmdOf(c)));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const FILEISH = /^(file|folder|path|source|dest|dir|archive)$/i;

function hl(t, vals) {
  let out = '', i = 0;
  for (const m of t.matchAll(PH)) {
    const v = vals ? vals[m[1]] : m[2];
    out += esc(t.slice(i, m.index)) + `<span class="ph" title="${esc(m[1])}">${esc(v ? v : `<${m[1]}>`)}</span>`;
    i = m.index + m[0].length;
  }
  return out + esc(t.slice(i));
}
function partsOf(c, tpl) {
  const s = plain(tpl), hits = [];
  for (const [k, v] of Object.entries(c.parts || {})) {
    const re = new RegExp((/^[\w-]/.test(k) ? '(?<![\\w-])' : '') + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + (/\w$/.test(k) ? '(?!\\w)' : ''));
    const m = re.exec(s);
    if (m) hits.push({i: m.index, end: m.index + k.length, k, v});
  }
  hits.sort((a, b) => a.i - b.i || b.end - a.end);
  const out = []; let end = -1;
  for (const h of hits) if (h.i >= end) { out.push(h); end = h.end; }
  return out;
}
const hintFor = (c, n) => { const p = c.parts || {}; return p[`<${n}>`] ?? (Object.entries(p).find(([k]) => k.includes(`<${n}`)) || [])[1] ?? ''; };
function badges(c) {
  const b = [];
  if (on(c.danger)) b.push(['warn', 'Dangerous', 'Dangerous — asks for confirmation first']);
  if (needsAdmin(c)) b.push(['shield', 'Admin', S.os === 'mac' ? 'Needs your Mac password (sudo)' : 'Needs Administrator rights']);
  if (on(c.term)) b.push(['ext', 'Separate window', 'Opens in a separate terminal window']);
  if (paramsOf(cmdOf(c)).length) b.push(['edit', 'Needs input', 'Asks for input before running']);
  return b;
}

async function boot() {
  $('#logo').innerHTML = ico('logo');
  $('#searchIco').innerHTML = ico('search');
  [['btnFinder', 'folder'], ['btnTerm', 'term'], ['btnReset', 'reset'], ['btnClear', 'clear'], ['btnHelp', 'help'],
   ['btnExt', 'ext'], ['btnAdmin', 'shield'], ['btnSave', 'star'], ['btnAbout', 'info']].forEach(([id, i]) => { $('#' + id).innerHTML = ico(i); });
  $('#btnRun').innerHTML = `${ico('play')} Run`;
  $('#btnStop').innerHTML = `${ico('stop')} Stop`;
  if (!TOKEN) return fatal('Open Arya Terminal Assistant from its app icon — this page cannot be used on its own.');
  let d;
  try { d = await api('/api/init'); } catch (e) { return fatal(e.message); }
  Object.assign(S, {os: d.os, sep: d.sep, home: d.home, cwd: d.cwd, admin: d.admin, shell: d.shell, osName: d.osName, dataDir: d.dataDir, version: d.version || '', edition: d.edition || '', customLibrary: d.customLibrary || ''});
  const lib = d.library || {};
  S.cats = [...(lib.categories || []), MY_CAT];
  S.lib = (lib.commands || []).filter(c => c && c.title && c.cat);
  S.mine = (Array.isArray(d.mine) ? d.mine : []).filter(c => c && c.title).map(c => ({...c, cat: 'my', mine: true}));
  const st = d.state || {};
  S.history = Array.isArray(st.history) ? st.history.filter(h => typeof h === 'string') : [];
  S.hi = S.history.length;
  Object.assign(S.settings, st.settings || {});
  S.params = st.params && typeof st.params === 'object' ? st.params : {};
  S.cat = S.cats.some(c => c.id === S.settings.cat) ? S.settings.cat : S.cats[0].id;
  const isMac = S.os === 'mac';
  $('#osPill').textContent = `${d.osName} · ${d.shell}`;
  $('#searchKbd').textContent = isMac ? '⌘K' : 'Ctrl K';
  $('#btnFinder').title = isMac ? 'Open this folder in Finder' : 'Open this folder in File Explorer';
  $('#btnAdmin').hidden = isMac;
  $('#autoRun').checked = !!S.settings.autoRun;
  renderCats(); renderKeys(); renderCwd(); showInfo(null); welcome(d.libraryError || lib.error);
  setInterval(() => api('/api/hello', {}).catch(() => {}), 30000);
  addEventListener('pagehide', () => navigator.sendBeacon('/api/bye', JSON.stringify({token: TOKEN, cid: CID})));
  try { if (outerWidth < 1000 && screen.availWidth >= 1100) resizeTo(Math.min(1320, screen.availWidth - 60), Math.min(860, screen.availHeight - 60)); } catch (e) {}
  CMD.focus();
}
function fatal(msg) { OUT.innerHTML = `<div class="welcome"><h2>Arya Terminal Assistant</h2><div class="warnbox">${ico('warn')}<span>${esc(msg)}</span></div></div>`; }
function offline() { if (!S.offline) { S.offline = true; toast('Lost connection to Arya — start the app again.', 8000); } }
function welcome(err) {
  const w = document.createElement('div');
  w.className = 'welcome';
  w.innerHTML = `<h2>Welcome to Arya Terminal Assistant</h2>
    <p>Every command is a <b>key</b>. Click a key on the left: the command is typed into the command line below and runs in your real ${esc(S.shell)} shell. Hover a key to read exactly what it does and what every part means.</p>
    <div class="tips"><span><kbd>Enter</kbd> run</span><span><kbd>↑</kbd> <kbd>↓</kbd> history</span><span><kbd>Tab</kbd> complete names</span><span><kbd>Ctrl</kbd>+<kbd>C</kbd> stop</span><span><kbd>Shift</kbd>+click a key: insert only</span><span><kbd>${S.os === 'mac' ? '⌘' : 'Ctrl'}</kbd>+<kbd>K</kbd> search</span></div>
    ${err ? `<div class="warnbox">${ico('warn')}<span>${esc(err)}</span></div>` : ''}
    <p class="meta">${esc(S.osName)} · ${esc(S.shell)} · ${S.lib.filter(cmdOf).length} built-in commands · settings and your keys are saved in <code>${esc(S.dataDir)}</code></p>`;
  OUT.append(w);
}

let saveT = 0;
function saveState() {
  clearTimeout(saveT);
  saveT = setTimeout(() => api('/api/state', {state: {history: S.history.slice(-300), settings: S.settings, params: S.params, cwd: S.cwd}}).catch(() => {}), 600);
}
async function saveMine() {
  try { await api('/api/mine', {items: S.mine.map(({mine, cat, ...c}) => c)}); }
  catch (e) { toast('Could not save: ' + e.message); }
}

function renderCats() {
  const count = id => (id === 'my' ? S.mine : S.lib.filter(c => c.cat === id)).filter(cmdOf).length;
  $('#cats').innerHTML = S.cats.map(c => `<button class="cat${!S.q && c.id === S.cat ? ' on' : ''}" data-id="${esc(c.id)}">${c.icon || ''} ${esc(c.name)}<span class="n">${count(c.id)}</span></button>`).join('');
}
function visible() {
  const all = S.lib.concat(S.mine).filter(cmdOf);
  if (!S.q) return all.filter(c => c.cat === S.cat);
  const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return all.filter(c => {
    const hay = [c.title, cmdOf(c), c.desc, (S.cats.find(x => x.id === c.cat) || {}).name].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  });
}
function renderKeys() {
  const box = $('#keys'), list = visible();
  box.innerHTML = '';
  list.forEach(c => box.append(keyEl(c)));
  if (!S.q && S.cat === 'my') {
    const add = document.createElement('button');
    add.className = 'key add';
    add.innerHTML = `${ico('plus')}<span>Add a command</span>`;
    add.onclick = () => saveDialog(CMD.value.trim());
    box.append(add);
    if (!S.mine.length) box.insertAdjacentHTML('beforeend', '<div class="empty">Save the commands you use most as keys: type one in the command line and press ☆, or use “Add a command”.</div>');
  }
  if (S.q && !list.length) box.innerHTML = `<div class="empty">No command matches “${esc(S.q)}”.</div>`;
}
function keyEl(c) {
  const b = document.createElement('button');
  b.className = 'key' + (on(c.danger) ? ' danger' : '');
  b.innerHTML = `<span class="t">${esc(c.title)}</span><span class="r"><code>${esc(shown(cmdOf(c)))}</code><span class="bd">${badges(c).map(([i, , tip]) => `<i class="i-${i}" title="${esc(tip)}">${ico(i)}</i>`).join('')}</span></span>`;
  b.onmouseenter = () => { clearTimeout(S.hov); S.hov = setTimeout(() => showInfo(c), 110); };
  b.onfocus = () => showInfo(c);
  b.onclick = e => { clearTimeout(S.hov); showInfo(c); press(b); activate(c, e.shiftKey); };
  return b;
}
function press(el) { el.classList.add('press'); setTimeout(() => el.classList.remove('press'), 140); }

function showInfo(c) {
  const box = $('#info');
  if (!c) {
    box.innerHTML = `<div class="blank">${ico('help')}<span>Hover over a key to see what the command does,<br>what every part means, and its equivalent on ${S.os === 'mac' ? 'Windows' : 'macOS'}.</span></div>`;
    return;
  }
  const tpl = cmdOf(c), other = otherOf(c), parts = partsOf(c, tpl);
  box.innerHTML = `<h3>${esc(c.title)} ${badges(c).map(([i, label, tip]) => `<span class="tag ${i}" title="${esc(tip)}">${ico(i)}${label}</span>`).join('')}</h3>
    <div class="cmdline"><code>${hl(tpl)}</code>
      <button class="ib" data-a="run" title="Run">${ico('play')}</button>
      <button class="ib" data-a="ins" title="Insert into the command line to edit">${ico('edit')}</button>
      <button class="ib" data-a="copy" title="Copy command">${ico('copy')}</button></div>
    ${c.desc ? `<p class="md">${md(c.desc)}</p>` : ''}
    ${parts.length ? `<div class="parts"><div class="pt">What each part means</div>${parts.map(p => `<div class="p"><code title="${esc(p.k)}">${esc(p.k)}</code><span class="md">${md(p.v)}</span></div>`).join('')}</div>` : ''}
    ${other ? `<div class="other">On ${S.os === 'mac' ? 'Windows' : 'macOS'}: <code>${esc(shown(other))}</code></div>` : ''}
    ${c.mine ? `<div class="btns" style="margin-top:12px"><button class="btn ghost" data-a="del">${ico('trash')} Delete this key</button></div>` : ''}`;
  box.onclick = e => {
    const a = (e.target.closest('[data-a]') || {}).dataset?.a;
    if (a === 'run') activate(c, false, true);
    else if (a === 'ins') activate(c, true);
    else if (a === 'copy') copyText(shown(tpl));
    else if (a === 'del') deleteMine(c);
  };
}

async function activate(c, insertOnly = false, forceRun = false) {
  if (S.busy) return;
  const tpl = cmdOf(c), ps = paramsOf(tpl);
  if (ps.length || (on(c.danger) && !insertOnly)) return paramDialog(c, tpl, ps);
  if (insertOnly || (!S.settings.autoRun && !forceRun)) return insert(tpl, c);
  if (S.job) return busyToast();
  await typeIn(tpl);
  run(tpl, c, true);
}
function insert(text, meta) {
  setInput(text);
  CMD.focus();
  S.inserted = {text, meta};
}
async function typeIn(text) {
  S.busy = true;
  CMD.classList.add('typing');
  const step = Math.max(1, Math.ceil(text.length / 20));
  for (let i = step; i < text.length; i += step) { CMD.value = text.slice(0, i); autosize(); await sleep(11); }
  CMD.value = text; autosize();
  await sleep(90);
  CMD.classList.remove('typing');
  S.busy = false;
}
function paramDialog(c, tpl, ps) {
  const danger = on(c.danger), last = S.params[keyOf(c)] || {};
  const d = openModal(`<h3>${danger ? ico('warn') : ''}${esc(c.title)}</h3>
    ${danger ? `<div class="warnbox">${ico('warn')}<span>Dangerous command — it may delete data or change your system, and might not be undoable. Check the final command carefully.</span></div>` : ''}
    <div class="pv" id="pv"></div>
    ${ps.map(p => `<label class="fld"><span><code>${esc(p.name)}</code>${hintFor(c, p.name) ? ' — ' + md(hintFor(c, p.name)) : ''}</span>
      <input data-n="${esc(p.name)}" value="${esc(last[p.name] ?? p.def)}" ${FILEISH.test(p.name) ? 'list="arya-files"' : ''} autocomplete="off" spellcheck="false" autocapitalize="off"></label>`).join('')}
    <datalist id="arya-files"></datalist>
    <div class="btns"><button class="btn ${danger ? 'red' : 'primary'}" data-a="run">${ico('play')} ${danger ? 'Yes, run it' : 'Run'}</button>
      <button class="btn" data-a="ins">${ico('edit')} Insert only</button><button class="btn ghost" data-a="x">Cancel</button></div>`);
  const inputs = $$('input[data-n]', d);
  const vals = () => Object.fromEntries(inputs.map(i => [i.dataset.n, i.value]));
  const preview = () => { $('#pv', d).innerHTML = hl(tpl, vals()); };
  inputs.forEach(i => i.addEventListener('input', () => { i.classList.remove('bad'); preview(); }));
  preview();
  if (inputs.some(i => i.hasAttribute('list'))) {
    api('/api/complete', {cwd: S.cwd, prefix: ''}).then(r => { $('#arya-files', d).innerHTML = (r.items || []).map(it => `<option value="${esc(it.n)}">`).join(''); }).catch(() => {});
  }
  const go = async mode => {
    if (mode === 'x') return closeModal();
    const empty = inputs.filter(i => !i.value.trim());
    if (empty.length) { empty.forEach(i => i.classList.add('bad')); empty[0].focus(); return; }
    const v = vals();
    closeModal(true);
    S.params[keyOf(c)] = v; saveState();
    const cmd = fillIn(tpl, v);
    if (mode === 'ins') return insert(cmd, c);
    if (S.job) return busyToast();
    await typeIn(cmd);
    run(cmd, c, true);
  };
  d.addEventListener('click', e => { const a = (e.target.closest('[data-a]') || {}).dataset?.a; if (a) go(a); });
  d.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' && !danger) { e.preventDefault(); go('run'); } });
  const first = inputs.find(i => !i.value) || inputs[0];
  if (first) { first.focus(); first.select(); } else $('[data-a=' + (danger ? 'x' : 'run') + ']', d).focus();
}

const RISKY = /(^|[\s;&|(])(rm\s+(-\w*\s+)*-\w*[rf]|Remove-Item\b[^;|]*-Recurse|rd\s+\/s|rmdir\s+\/s|del\s+\/[sq]|format\s+[a-z]:|diskpart|mkfs|dd\s+if=|shutdown\b|Stop-Computer|Restart-Computer|Clear-RecycleBin|git\s+reset\s+--hard|git\s+clean\s+-\w*f|git\s+push\s+(-f|--force))/i;
function isInteractive(cmd) {
  const c = cmd.trim().replace(/^sudo\s+/, '');
  if (/^(vim?|nvim|nano|pico|emacs|micro|htop|btop|ssh|telnet|ftp|sftp|mysql|psql|sqlite3|redis-cli|mongosh?|tmux|screen|watch)(\s|$)/.test(c)) return true;
  if (/^top(\s|$)/.test(c) && !/\s-l\s*\d/.test(c)) return true;
  return /^(python3?|py|node|irb|bash|zsh|sh|fish|pwsh|powershell|cmd|deno|bun|lua)$/.test(c);
}
async function run(cmd, meta = null, confirmed = false) {
  cmd = String(cmd).replace(/\s+$/, '');
  if (!cmd.trim()) return;
  if (S.job) return busyToast();
  if (/^\s*(clear|cls|clear-host)\s*$/i.test(cmd)) { setInput(''); clearOut(); return; }
  if (/^\s*exit\s*$/i.test(cmd)) { setInput(''); toast('To quit Arya, just close the window.'); return; }
  const danger = meta ? on(meta.danger) : RISKY.test(cmd);
  if (danger && !confirmed) {
    const ok = await ask({title: 'Run this command?', danger: true, code: cmd, ok: 'Yes, run it',
      body: meta ? 'This command is marked as dangerous: it may delete data or change your system, and might not be undoable.'
                 : 'This command looks destructive: it may delete data or change your system, and might not be undoable.'});
    if (!ok) return;
  }
  pushHistory(cmd);

      <li>Badges: <span class="i-edit">✎</span> asks for input first · <span class="i-warn">⚠</span> dangerous, asks to confirm · <span class="i-shield">🛡</span> needs administrator rights · <span class="i-ext">↗</span> opens a separate terminal window.</li>
      <li>You can type any command yourself. <code>cd</code>, <code>export</code> and Python virtual environments carry over to the next command.</li>
      <li>When a running program asks a question, type the answer in the command line and press Enter.</li>
      <li>Interactive full-screen programs (vim, nano, top, ssh…) automatically open in a separate terminal window.</li>
      <li>Turn off <b>Run on click</b> (top bar) to have keys only type the command, so you can edit it before running.</li>
    </ul>
    <h4>Shortcuts</h4>
    <div class="grid">
      <span><kbd>Enter</kbd></span><span>Run · send input to a running program</span>
      <span><kbd>Shift</kbd>+<kbd>Enter</kbd></span><span>New line</span>
      <span><kbd>↑</kbd> <kbd>↓</kbd></span><span>Previous / next command</span>
      <span><kbd>Tab</kbd></span><span>Complete file and folder names</span>
      <span><kbd>Ctrl</kbd>+<kbd>C</kbd></span><span>Stop the running command</span>
      <span><kbd>Ctrl</kbd>+<kbd>D</kbd></span><span>End input for a running program</span>
      <span><kbd>Ctrl</kbd>+<kbd>L</kbd></span><span>Clear the output</span>
      <span><kbd>${mod}</kbd>+<kbd>K</kbd></span><span>Search commands</span>
      <span><kbd>Shift</kbd>+click</span><span>Insert a key's command without running it</span>
      <span><kbd>Esc</kbd></span><span>Clear the command line · close dialogs</span>
    </div>
    <h4>Your files</h4>
    <div class="grid">
      <span><code>commands.json</code></span><span>${S.edition === 'native' ? `The command library is built into the app. To customize it, save your own copy as <code>${esc(S.customLibrary)}</code> and reload the window.` : 'The built-in command library — edit it to change or add keys'}</span>
      <span><code>my_commands.json</code></span><span>Keys you saved with ☆</span>
    </div>
    <p class="meta" style="color:var(--dim);font-size:11.5px;margin:12px 0 0">Saved in <code>${esc(S.dataDir)}</code> · reload the window after editing the files.</p>
    <p class="meta" style="color:var(--dim);font-size:11.5px;margin:8px 0 0">Created by Ali Mohammadi Ruzbahani · <a href="https://ruzbahani.com" target="_blank" rel="noopener" style="color:var(--accent)">ruzbahani.com</a></p>
    <div class="btns" style="margin-top:14px"><button class="btn primary" data-a="x">Got it</button></div>`);
  d.addEventListener('click', e => { if ((e.target.closest('[data-a]') || {}).dataset?.a === 'x') closeModal(); });
  $('[data-a=x]', d).focus();
}
let toastT = 0;
function toast(msg, ms = 2800) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copied to clipboard');
}

function about() {
  const d = openModal(`<div class="about">
      <div class="about-logo">${ico('logo')}</div>
      <h3>Arya Terminal Assistant</h3>
      <p class="about-ver">Version ${esc(S.version)}${S.edition === 'native' ? ' · native edition' : ''}</p>
      <p>A compact graphical terminal: every command is a key with a full explanation, for macOS and Windows.</p>
      <div class="about-by">Created by<b>Ali Mohammadi Ruzbahani</b><span>AI Security Researcher</span>
        <a href="https://ruzbahani.com" target="_blank" rel="noopener">ruzbahani.com ↗</a></div>
      <div class="btns"><button class="btn primary" data-a="x">Close</button></div></div>`);
  d.addEventListener('click', e => { if ((e.target.closest('[data-a]') || {}).dataset?.a === 'x') closeModal(); });
  $('[data-a=x]', d).focus();
}

window.aryaDrop = paths => {
  const q = p => (/[\s'"`$&|;()<>{}[\]#*?!]/.test(p) ? `"${p}"` : p);
  const text = paths.map(q).join(' '), v = CMD.value, a = CMD.selectionStart, b = CMD.selectionEnd;
  const pre = v.slice(0, a), sp = pre && !/\s$/.test(pre) ? ' ' : '';
  CMD.value = pre + sp + text + v.slice(b);
  const caret = (pre + sp + text).length;
  CMD.setSelectionRange(caret, caret); autosize(); CMD.focus(); S.inserted = null;
};
const isFileDrag = e => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');
addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
addEventListener('drop', e => { if (isFileDrag(e)) { e.preventDefault(); toast('This window can\'t read dropped file locations — type the name instead (Tab completes it).'); } });

CMD.addEventListener('keydown', e => {
  if (!$('#pop').hidden) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); return popMove(e.key === 'ArrowDown' ? 1 : -1); }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); const P = S.pop; hidePop(); return P.pick(P.list[P.i]); }
    if (e.key === 'Escape') { e.preventDefault(); return hidePop(); }
    hidePop();
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); if (!S.job) complete(); }
  else if (e.key === 'ArrowUp' && !CMD.value.slice(0, CMD.selectionStart).includes('\n')) { e.preventDefault(); histMove(-1); }
  else if (e.key === 'ArrowDown' && !CMD.value.slice(CMD.selectionEnd).includes('\n')) { e.preventDefault(); histMove(1); }
  else if (e.key === 'Escape' && $('#modal').hidden) { setInput(''); S.inserted = null; }
  else if (e.ctrlKey && !e.metaKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'c' && S.job && CMD.selectionStart === CMD.selectionEnd) { e.preventDefault(); stop(); }
    else if (k === 'd' && S.job && S.job.id) { e.preventDefault(); api('/api/input', {id: S.job.id, eof: true}).catch(() => {}); S.job.blk.echo('^D'); }
    else if (k === 'l') { e.preventDefault(); clearOut(); }
  }
});
CMD.addEventListener('input', () => { autosize(); hidePop(); });
CMD.addEventListener('blur', () => setTimeout(hidePop, 150));
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (e.key === 'Escape' && !$('#modal').hidden) { e.preventDefault(); closeModal(); }
  else if (!typing && $('#modal').hidden && e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (!typing && $('#modal').hidden && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && (e.target === document.body || e.target.closest('.out'))) CMD.focus();
});
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); renderCats(); renderKeys(); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; renderCats(); renderKeys(); CMD.focus(); }
  else if (e.key === 'Enter') { const first = visible()[0]; if (first) { showInfo(first); activate(first, e.shiftKey); } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); const k = $('#keys .key'); if (k) k.focus(); }
});
$('#cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  S.cat = b.dataset.id; S.settings.cat = S.cat; saveState();
  S.q = ''; $('#q').value = '';
  renderCats(); renderKeys(); $('#keys').scrollTop = 0;
});
$('#keys').addEventListener('mouseleave', () => clearTimeout(S.hov));
$('#keys').addEventListener('keydown', e => {
  const keys = $$('#keys .key'), i = keys.indexOf(document.activeElement);
  if (i < 0) return;
  const d = {ArrowRight: 1, ArrowLeft: -1, ArrowDown: 2, ArrowUp: -2}[e.key];
  if (d) { e.preventDefault(); const n = keys[i + d]; if (n) n.focus(); else if (d < 0 && i + d < 0) $('#q').focus(); }
});
$('#crumbs').addEventListener('click', async e => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  if (S.job) return busyToast();
  try {
    const r = await api('/api/cd', {cwd: S.cwd, path: b.dataset.p});
    if (r.cwd && r.cwd !== S.cwd) { setCwd(r.cwd); sysLine(`→ ${esc(r.cwd)}`); }
  } catch (err) { toast(err.message); }
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
$('#autoRun').addEventListener('change', e => {
  S.settings.autoRun = e.target.checked; saveState();
  toast(e.target.checked ? 'Clicking a key now runs it right away' : 'Clicking a key now only types the command — press Enter to run it');
});
$('#btnRun').addEventListener('click', () => { submit(); CMD.focus(); });
$('#btnStop').addEventListener('click', () => { stop(); CMD.focus(); });
$('#btnFinder').addEventListener('click', () => run(S.os === 'mac' ? 'open .' : 'Invoke-Item .'));
$('#btnTerm').addEventListener('click', () => api('/api/terminal', {cmd: '', cwd: S.cwd}).then(() => toast('Opened the system terminal in this folder')).catch(e => toast(e.message)));
$('#btnClear').addEventListener('click', () => { clearOut(); CMD.focus(); });
$('#btnHelp').addEventListener('click', help);
$('#btnAbout').addEventListener('click', about);
$('#btnReset').addEventListener('click', async () => {
  if (S.job) return busyToast();
  try { const r = await api('/api/reset', {}); S.venv = ''; setCwd(r.cwd); sysLine('↺ Fresh session — home folder, original environment variables'); } catch (e) { toast(e.message); }
});
$('#btnExt').addEventListener('click', () => {
  const v = CMD.value.trim();
  if (S.job) return busyToast();
  if (!v) return $('#btnTerm').click();
  pushHistory(v); setInput(''); runExternal(v, null);
});
$('#btnAdmin').addEventListener('click', () => {
  const v = CMD.value.trim();
  if (!v) return toast('Type a command first, then press 🛡 to run it as Administrator.');
  if (S.job) return busyToast();
  pushHistory(v); setInput(''); runElevated(v, null);
});
$('#btnSave').addEventListener('click', () => saveDialog(CMD.value.trim()));

boot();
</script>
</body>
</html>
